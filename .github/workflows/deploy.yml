name: Deploy Firebase (functions + rules)

# האתר עצמו מתארח ב-Vercel (galis.app) ופורס אוטומטית מ-main — לכן אין כאן פריסת Hosting.
# ה-workflow הזה פורס רק Cloud Functions + כללי/אינדקסי Firestore, ורץ רק כשקבצים אלה משתנים
# (או ידנית דרך "Run workflow"). כך push רגיל של קוד האפליקציה לא מפעיל פריסה כפולה.
on:
  push:
    branches: [ main ]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
  workflow_dispatch:

jobs:
  deploy_functions_rules:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # דורש ב־GCP: ל־client_email של ה־SA (הסיקרט) תפקיד Service Account User על
      # galis-6ebbc@appspot.gserviceaccount.com
      - name: Deploy Firestore rules, indexes, and Cloud Functions
        run: |
          (cd functions && npm ci && npm run build)
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "${RUNNER_TEMP}/galis-ci-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="${RUNNER_TEMP}/galis-ci-sa.json"
          npx firebase-tools@latest deploy --only firestore:rules,firestore:indexes,functions --project galis-6ebbc --non-interactive --force
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GALIS_6EBBC }}
